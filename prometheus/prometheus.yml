global:
  scrape_interval: 15s

# Rules and alerts are read from the specified file(s)
rule_files:
  - /etc/prometheus/alerts_rules/cpu_rules.yml
  - /etc/prometheus/alerts_rules/process_rules.yml
  - /etc/prometheus/alerts_rules/memory_rules.yml
  - /etc/prometheus/alerts_rules/disk_rules.yml


# Alerting specifies settings related to the Alertmanager
alerting:
  alertmanagers:
    - static_configs:
      - targets:
        # Alertmanager's default port is 9093
        - localhost:9093
        #- alertmanager.spontansolutions.com

    
scrape_configs:
  - job_name: 'node-exporter'
    ec2_sd_configs:
      - region: us-east-1
        port: 9100
        filters:
          - name: tag:prometheus
            values:
              - enabled
    relabel_configs:
      - target_label: Env
        replacement: production

      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance

      - source_labels: [__meta_ec2_public_ip]
        target_label: public-ip


  - job_name: 'process-exporter'
    ec2_sd_configs:
      - region: us-east-1
        port: 9256
        filters:
          - name: tag:prometheus
            values:
              - enabled
    relabel_configs:
      - target_label: Env
        replacement: production

      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance

      - source_labels: [__meta_ec2_public_ip]
        target_label: public-ip

        #static_configs:
        #- targets:
        # - 54.160.215.146:9100

